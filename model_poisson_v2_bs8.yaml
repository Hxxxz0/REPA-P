name: poisson_v2_bs8
# Use normalized data (rho stores charge q, not q/h²)
data_dir_train: ./data/poisson_v2/train
data_dir_valid: ./data/poisson_v2/valid

# Diffusion parameters
diff_steps: 1000
ddim_steps: 50
x0_estimation: mean

# Loss weights
c_data: 1.0
c_residual: 0.01

# Training parameters
train_batch_size: 8
train_iterations: 300000
unet_dim: 64
fd_acc: 2

# Evaluation parameters
test_eval_freq: 500
sample_freq: 10000
save_freq: 5000
plot_freq: 1000
ema_start: 1000
no_samples: 8

# Other
wandb_track: false
create_gif: false

# v2 flag: use normalized data
use_normalized_rho: true
